<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site Básico</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background-color: #f4f4f4;
      color: #333;
    }

    header{
      background-color: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav{
      background-color: #1e40af;
      padding: 10px;
      text-align: center;
    }

    nav a{
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover{
      color: #dbeafe;
    }

    .container{
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .card{
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h2{
      margin-bottom: 10px;
      color: #2563eb;
    }

    button{
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover{
      background-color: #1e40af;
    }

    footer{
      background-color: #111827;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Meu Primeiro Site</h1>
    <p>Exemplo básico usando HTML e CSS</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Sobre</a>
    <a href="#">Serviços</a>
    <a href="#">Contato</a>
  </nav>

  <div class="container">

    <div class="card">
      <h2>Sobre o Site</h2>
      <p>
        Este é um exemplo simples de site criado apenas com HTML e CSS.
      </p>

      <button>Clique Aqui</button>
    </div>

    <div class="card">
      <h2>Meus Serviços</h2>
      <p>
        Desenvolvimento web, design responsivo e criação de aplicações.
      </p>
    </div>

  </div>

  <footer>
    <p>© 2026 - Meu Site Básico</p>
  </footer>

</body>
</html>
